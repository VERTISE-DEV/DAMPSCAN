# Hourly check for survey reports past their 24 hours (lib/report-late.js).
# The hosting plan only runs its own schedules once a day. Needs the
# repository secret CRON_SECRET, the same value as on Vercel; without it the
# step is skipped and the morning and evening runs still check.
name: Report due check
on:
  schedule:
    - cron: '7 * * * *'
  workflow_dispatch:
permissions: {}
jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - name: Check for overdue reports
        env:
          CRON_SECRET: ${{ secrets.CRON_SECRET }}
        if: env.CRON_SECRET != ''
        run: curl -fsS -H "Authorization: Bearer $CRON_SECRET" https://dampscan.co.uk/api/cron/report-due
