<!DOCTYPE html>
<html lang="en-GB">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<meta name="robots" content="noindex, nofollow" />
<!-- The link is its key, so it must not travel to any other site. -->
<meta name="referrer" content="no-referrer" />
<title>Your invoice</title>
<style>
  :root { --ink:#16191e; --muted:#5b6370; --line:#e3e6ea; --paper:#ffffff; --band:#171a1f; --accent:#c8742c; }
  * { box-sizing:border-box; }
  body { margin:0; background:#f2f3f5; color:var(--ink); font:16px/1.5 system-ui, -apple-system, "Segoe UI", Roboto, sans-serif; }
  .sheet { max-width:820px; margin:24px auto; background:var(--paper); border-radius:14px; overflow:hidden; box-shadow:0 2px 18px rgba(0,0,0,.06); }
  header { background:var(--band); color:#fff; padding:26px 32px; display:flex; justify-content:space-between; gap:18px; flex-wrap:wrap; }
  header h1 { margin:0; font-size:26px; letter-spacing:.2px; }
  header p { margin:4px 0 0; color:#c9ced6; font-size:14px; }
  .contact { text-align:right; font-size:14px; color:#e8ebef; }
  .contact a { color:#fff; text-decoration:none; }
  main { padding:28px 32px 32px; }
  .meta { display:grid; grid-template-columns:repeat(auto-fit, minmax(160px, 1fr)); gap:14px 24px; margin-bottom:24px; }
  .meta div span { display:block; font-size:12px; text-transform:uppercase; letter-spacing:.6px; color:var(--muted); }
  .meta div strong { font-size:16px; }
  .notice { padding:12px 14px; border-radius:10px; margin:0 0 20px; background:#fff4e5; color:#7a4a12; }
  .notice.ok { background:#e9f6ee; color:#1f6b3a; }
  table { width:100%; border-collapse:collapse; }
  th { text-align:left; font-size:12px; text-transform:uppercase; letter-spacing:.6px; color:var(--muted); border-bottom:2px solid var(--line); padding:8px 6px; }
  td { padding:12px 6px; border-bottom:1px solid var(--line); vertical-align:top; }
  td small { display:block; color:var(--muted); }
  .num { text-align:right; white-space:nowrap; }
  .totals { margin-left:auto; margin-top:16px; width:min(100%, 320px); }
  .totals div { display:flex; justify-content:space-between; padding:6px 6px; }
  .totals .grand { border-top:2px solid var(--ink); margin-top:6px; padding-top:10px; font-size:20px; font-weight:700; }
  .terms { margin-top:28px; font-size:14px; color:var(--muted); }
  .terms p { margin:0 0 8px; }
  .actions { margin-top:22px; display:flex; gap:10px; flex-wrap:wrap; }
  .btn { display:inline-block; border:0; border-radius:999px; padding:11px 20px; font:inherit; font-weight:600; cursor:pointer; text-decoration:none; }
  .btn-primary { background:var(--accent); color:#fff; }
  .btn-ghost { background:transparent; color:var(--ink); border:1px solid var(--line); }
  .skip-link { position:absolute; left:-9999px; top:8px; background:#fff; color:var(--ink); padding:8px 14px; border-radius:8px; z-index:10; }
  .skip-link:focus { left:8px; }
  .state { padding:60px 32px; text-align:center; color:var(--muted); }
  @media (max-width:560px) { header, main { padding-left:18px; padding-right:18px; } .contact { text-align:left; } .sheet { margin:0; border-radius:0; } }
  @media print { body { background:#fff; } .sheet { box-shadow:none; margin:0; max-width:none; } .actions { display:none; } header { -webkit-print-color-adjust:exact; print-color-adjust:exact; } }
  .from { font-size:13px; color:#c9ced6; margin-top:8px; line-height:1.45; }
  .paid { margin-top:18px; }
  .paid h2 { font-size:14px; text-transform:uppercase; letter-spacing:.6px; color:var(--muted); margin:0 0 6px; }
  .balance { font-size:18px; font-weight:700; }
</style>
</head>
<body>
<a class="skip-link" href="#main">Skip to the invoice</a>
<div class="sheet">
  <div class="state" id="state">Loading your invoice…</div>
  <div id="doc" hidden>
    <header>
      <div>
        <h1 id="brand"></h1>
        <p>Invoice</p>
        <div class="from" id="from"></div>
      </div>
      <div class="contact" id="contact"></div>
    </header>
    <main id="main" tabindex="-1">
      <p class="notice ok" id="notice" hidden></p>
      <div class="meta">
        <div><span>Invoice to</span><strong id="customer"></strong></div>
        <div><span>Invoice number</span><strong id="number"></strong></div>
        <div><span>Invoice date</span><strong id="issued"></strong></div>
        <div><span>Payment due</span><strong id="due"></strong></div>
      </div>
      <table>
        <thead><tr><th>Description</th><th class="num">Net</th></tr></thead>
        <tbody id="lines"></tbody>
      </table>
      <div class="totals">
        <div><span>Net</span><span id="net"></span></div>
        <div><span id="vat-label">VAT</span><span id="vat"></span></div>
        <div class="grand"><span>Total</span><span id="total"></span></div>
      </div>
      <div class="paid" id="paid" hidden>
        <h2>Paid so far</h2>
        <table><tbody id="payments"></tbody></table>
        <div class="totals"><div class="balance"><span>Balance due</span><span id="balance"></span></div></div>
      </div>
      <div class="terms">
        <p id="pay"></p>
        <p id="legal"></p>
      </div>
      <div class="actions">
        <button class="btn btn-primary" id="print" type="button">Print or save as PDF</button>
        <a class="btn btn-ghost" id="call" href="#">Call us</a>
      </div>
    </main>
  </div>
</div>
<script>
(function () {
  'use strict';
  var el = function (id) { return document.getElementById(id); };
  var money = function (p) { return '£' + (p / 100).toLocaleString('en-GB', { minimumFractionDigits: 2, maximumFractionDigits: 2 }); };
  var day = function (iso) { return new Date(iso + 'T12:00:00Z').toLocaleDateString('en-GB', { day: 'numeric', month: 'long', year: 'numeric' }); };
  var LABEL = { deposit: 'Deposit', stage: 'Stage payment', balance: 'Balance', retention: 'Retention', refund: 'Refund', payment: 'Payment' };
  function show(m) { el('state').textContent = m; }
  function lines(parent, text) { text.forEach(function (t) { var d = document.createElement('div'); d.textContent = t; parent.appendChild(d); }); }

  var token = new URLSearchParams(location.search).get('t') || '';
  if (!token) { show('This invoice link is incomplete. Please use the full link you were sent.'); return; }

  fetch('/api/quote?doc=invoice&t=' + encodeURIComponent(token), { headers: { Accept: 'application/json' } })
    .then(function (r) { return r.json().then(function (body) { return { status: r.status, body: body }; }); })
    .then(function (res) {
      if (res.status === 404) { show('We could not find this invoice. Please check the link, or call us and we will send it again.'); return; }
      if (!res.body || !res.body.ok) { show('Your invoice could not be loaded just now. Please try again in a minute.'); return; }
      var b = res.body.brand, v = res.body.invoice;
      document.title = 'Invoice ' + v.number + ' | ' + b.name;
      el('brand').textContent = b.name;
      lines(el('from'), String(b.address || '').split(/\n|, /));
      var contact = el('contact');
      var tel = document.createElement('a'); tel.href = 'tel:' + b.phone; tel.textContent = b.phoneLabel;
      var mail = document.createElement('a'); mail.href = 'mailto:' + b.email + '?subject=' + encodeURIComponent('Invoice ' + v.number); mail.textContent = b.email;
      [tel, mail].forEach(function (a) { var d = document.createElement('div'); d.appendChild(a); contact.appendChild(d); });
      el('call').href = 'tel:' + b.phone;

      var who = el('customer');
      who.textContent = v.customerName || 'Customer';
      v.customerAddress.forEach(function (line) { who.appendChild(document.createElement('br')); who.appendChild(document.createTextNode(line)); });
      el('number').textContent = v.number;
      el('issued').textContent = day(v.issuedOn);
      el('due').textContent = v.dueOn ? day(v.dueOn) : 'On receipt';

      var tbody = el('lines');
      v.lines.forEach(function (l) {
        var tr = document.createElement('tr');
        var a = document.createElement('td');
        var strong = document.createElement('strong'); strong.textContent = l.label;
        var small = document.createElement('small'); small.textContent = l.description;
        a.appendChild(strong); a.appendChild(small);
        var p = document.createElement('td'); p.className = 'num'; p.textContent = money(l.pricePence);
        tr.appendChild(a); tr.appendChild(p); tbody.appendChild(tr);
      });
      el('net').textContent = money(v.netPence);
      el('vat-label').textContent = 'VAT at ' + (v.vatBp / 100) + '%';
      el('vat').textContent = money(v.vatPence);
      el('total').textContent = money(v.totalPence);

      if (v.payments.length) {
        el('paid').hidden = false;
        v.payments.forEach(function (p) {
          var tr = document.createElement('tr');
          var a = document.createElement('td'); a.textContent = (LABEL[p.label] || 'Payment') + ', ' + day(p.paidOn);
          var n = document.createElement('td'); n.className = 'num'; n.textContent = money(p.amountPence);
          tr.appendChild(a); tr.appendChild(n); el('payments').appendChild(tr);
        });
        el('balance').textContent = money(v.balancePence);
      }
      if (!v.balancePence) { el('notice').textContent = 'Paid in full. Thank you.'; el('notice').hidden = false; }
      el('pay').textContent = b.payment ? 'How to pay: ' + b.payment + '. Please use ' + v.number + ' as the reference.' : 'Please use ' + v.number + ' as the payment reference.';
      el('legal').textContent = [b.name, b.companyNumber ? 'Company number ' + b.companyNumber : '', 'VAT registration number ' + b.vatNumber].filter(Boolean).join('. ') + '. Quote ' + v.quoteNumber + '.';
      el('print').addEventListener('click', function () { window.print(); });
      el('state').hidden = true;
      el('doc').hidden = false;
    })
    .catch(function () { show('Your invoice could not be loaded just now. Please try again in a minute.'); });
})();
</script>
</body>
</html>
