<!DOCTYPE html>
<html lang="en-GB">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<meta name="robots" content="noindex, nofollow" />
<!-- The link is its key, so it must not travel to any other site. -->
<meta name="referrer" content="no-referrer" />
<title>How did we do?</title>
<style>
  :root { --ink:#16191e; --muted:#5b6370; --line:#e3e6ea; --paper:#ffffff; --band:#171a1f; --accent:#c8742c; --star:#e3a008; }
  * { box-sizing:border-box; }
  body { margin:0; background:#f2f3f5; color:var(--ink); font:16px/1.5 system-ui, -apple-system, "Segoe UI", Roboto, sans-serif; }
  .sheet { max-width:560px; margin:24px auto; background:var(--paper); border-radius:14px; overflow:hidden; box-shadow:0 2px 18px rgba(0,0,0,.06); }
  header { background:var(--band); color:#fff; padding:22px 28px; }
  header h1 { margin:0; font-size:22px; }
  main { padding:26px 28px 30px; }
  h2 { margin:0 0 8px; font-size:22px; }
  p { margin:0 0 14px; }
  .muted { color:var(--muted); font-size:14px; }
  .stars { display:flex; gap:6px; margin:18px 0 8px; }
  .stars button { width:52px; height:52px; border:1px solid var(--line); border-radius:12px; background:#fff; font-size:30px; line-height:1; color:#c5cad1; cursor:pointer; }
  .stars button.on { color:var(--star); border-color:var(--star); }
  .stars button:focus-visible, .btn:focus-visible, textarea:focus-visible { outline:3px solid var(--accent); outline-offset:2px; }
  textarea { width:100%; min-height:120px; padding:10px 12px; border:1px solid var(--line); border-radius:10px; font:inherit; }
  label { display:block; font-weight:600; margin:14px 0 6px; }
  .btn { display:inline-block; border:0; border-radius:999px; padding:11px 20px; font:inherit; font-weight:600; cursor:pointer; text-decoration:none; background:var(--accent); color:#fff; margin-top:12px; }
  .google { margin-top:22px; font-size:14px; color:var(--muted); }
  .google a { color:var(--ink); }
  .skip-link { position:absolute; left:-9999px; top:8px; background:#fff; color:var(--ink); padding:8px 14px; border-radius:8px; z-index:10; }
  .skip-link:focus { left:8px; }
  .state { padding:50px 28px; text-align:center; color:var(--muted); }
  @media (max-width:560px) { .sheet { margin:0; border-radius:0; } header, main { padding-left:16px; padding-right:16px; } .stars button { width:48px; height:48px; } }
</style>
</head>
<body>
<a class="skip-link" href="#main">Skip to the rating</a>
<div class="sheet">
  <div class="state" id="state">Loading…</div>
  <div id="doc" hidden>
    <header><h1 id="brand"></h1></header>
    <main id="main" tabindex="-1">
      <h2 id="ask">How did we do?</h2>
      <p class="muted">Tap a number of stars.</p>
      <div class="stars" id="stars" role="group" aria-label="Your rating out of five"></div>
      <p id="said" role="status"></p>
      <form id="better" hidden novalidate>
        <label for="comment">What could we have done better?</label>
        <textarea id="comment" maxlength="2000"></textarea>
        <p class="muted">This comes straight to us and is not published.</p>
        <button class="btn" type="submit">Send</button>
      </form>
      <p class="google" id="google" hidden>You can also <a id="google-link" href="#" rel="noopener">leave us a Google review</a>.</p>
    </main>
  </div>
</div>
<script>
(function () {
  'use strict';
  var el = function (id) { return document.getElementById(id); };
  var token = new URLSearchParams(location.search).get('t') || '';
  var picked = 0;
  var reviewUrl = null;
  function show(m) { el('state').textContent = m; el('state').hidden = false; el('doc').hidden = true; }

  function paint(n) {
    Array.prototype.forEach.call(el('stars').children, function (b, i) { b.classList.toggle('on', i < n); b.setAttribute('aria-pressed', String(i + 1 === n)); });
  }

  function send(body) {
    body.doc = 'rate'; body.t = token;
    return fetch('/api/quote', { method: 'POST', headers: { 'Content-Type': 'application/json', Accept: 'application/json' }, body: JSON.stringify(body) })
      .then(function (r) { return r.json(); });
  }

  function choose(n) {
    picked = n;
    paint(n);
    send({ stars: n }).then(function (res) {
      if (!res || !res.ok) { el('said').textContent = 'That did not save. Please try again in a minute.'; return; }
      /* Five stars goes on to Google; the Google link below is there for every score. */
      if (n === 5 && reviewUrl) {
        el('said').textContent = 'Thank you! Taking you to Google to say so…';
        location.href = reviewUrl;
        return;
      }
      el('said').textContent = n === 5 ? 'Thank you, that means a lot.' : 'Thank you for telling us.';
      el('better').hidden = n === 5;
      if (n < 5) el('comment').focus();
    }).catch(function () { el('said').textContent = 'That did not save. Please try again in a minute.'; });
  }

  el('better').addEventListener('submit', function (e) {
    e.preventDefault();
    var words = el('comment').value.trim();
    if (!words || !picked) return;
    send({ stars: picked, comment: words }).then(function (res) {
      if (!res || !res.ok) { el('said').textContent = 'That did not send. Please try again in a minute.'; return; }
      el('better').hidden = true;
      el('said').textContent = 'Thank you. We read every one of these, and we may be in touch to put it right.';
    });
  });

  if (!token) { show('This link is incomplete. Please use the full link you were sent.'); return; }
  fetch('/api/quote?doc=rate&t=' + encodeURIComponent(token), { headers: { Accept: 'application/json' } })
    .then(function (r) { return r.json().then(function (body) { return { status: r.status, body: body }; }); })
    .then(function (res) {
      if (res.status === 404) { show('We could not find this link. Please check it, or give us a call.'); return; }
      if (!res.body || !res.body.ok) { show('This page could not be loaded just now. Please try again in a minute.'); return; }
      var b = res.body.brand, r = res.body.rating;
      document.title = 'How did we do? | ' + b.name;
      el('brand').textContent = b.name;
      el('ask').textContent = (r.firstName ? r.firstName + ', how' : 'How') + ' did we do?';
      reviewUrl = b.reviewUrl;
      if (reviewUrl) { el('google-link').href = reviewUrl; el('google').hidden = false; }
      for (var i = 1; i <= 5; i++) {
        var btn = document.createElement('button');
        btn.type = 'button';
        btn.textContent = '★';
        btn.setAttribute('aria-label', i + (i === 1 ? ' star' : ' stars'));
        btn.addEventListener('click', choose.bind(null, i));
        el('stars').appendChild(btn);
      }
      if (r.stars) { picked = r.stars; paint(r.stars); el('said').textContent = 'You rated us ' + r.stars + ' out of 5. Tap again to change it.'; }
      el('state').hidden = true;
      el('doc').hidden = false;
    })
    .catch(function () { show('This page could not be loaded just now. Please try again in a minute.'); });
})();
</script>
</body>
</html>
